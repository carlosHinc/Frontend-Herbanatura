<div class="search-container">
  <div class="search-box">
    <ds-input
      [value]="value()"
      [placeholder]="placeholder()"
      class="search-input"
      (valueChange)="onInputChange($event)"
    />
    @if (value()) {
      <ds-icon-button
        icon="bi bi-x"
        (click)="onClear()"
        title="Limpiar búsqueda"
      />
    }
    <ds-icon icon="bi bi-search" modifiers="icon--input" />
  </div>
</div>
