<div class="register-container">
  <div class="register-card">
    <h1 class="register-title">Registrar usuario</h1>
    <p class="register-subtitle">Crear una nueva cuenta de usuario</p>

    @if (error()) {
      <div class="register-error">{{ error() }}</div>
    }

    @if (success()) {
      <div class="register-success">Usuario creado exitosamente</div>
    }

    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input
          id="name"
          type="text"
          [(ngModel)]="name"
          name="name"
          placeholder="Ingresa tu nombre completo"
          [disabled]="loading()"
        />
      </div>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Nombre de usuario"
          [disabled]="loading()"
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="correo@ejemplo.com"
          [disabled]="loading()"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Mínimo 6 caracteres"
          [disabled]="loading()"
        />
      </div>

      <div class="form-group">
        <label for="role">Rol</label>
        <select
          id="role"
          [(ngModel)]="idRole"
          name="idRole"
          [disabled]="loading()"
        >
          <option [value]="1">Administrador</option>
          <option [value]="2">Vendedor</option>
        </select>
      </div>

      <button type="submit" class="register-btn" [disabled]="loading()">
        @if (loading()) {
          Registrando...
        } @else {
          Registrar usuario
        }
      </button>
    </form>

    <p class="register-link">
      <a routerLink="/auth/login">← Volver al login</a>
    </p>
  </div>
</div>
